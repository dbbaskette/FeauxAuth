<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{oauth/fragments/aurora-head :: head('Device Sign-In — Enterprise OAuth')}"></head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
        <div class="card-elev">
            <div class="text-center mb-7">
                <div class="brand-mark mx-auto mb-3">F</div>
                <div class="eyebrow">Device Sign-In</div>
                <h1 class="text-2xl font-bold text-text mt-1">Confirm your device</h1>
                <p class="text-text-dim text-sm mt-1.5">Verify the code shown on your device, then sign in.</p>
            </div>

            <div th:if="${loginError}" class="alert-error mb-5">
                <span th:text="${loginError}">Error</span>
            </div>

            <form method="post" th:action="@{/device}" class="space-y-4">
                <div>
                    <label for="user_code" class="field-label">Device Code</label>
                    <input type="text" id="user_code" name="user_code" required
                           th:value="${userCode}"
                           autocomplete="off" autocapitalize="characters" spellcheck="false"
                           class="input font-mono text-center text-lg uppercase"
                           style="letter-spacing: 0.3em;"
                           placeholder="XXXX-XXXX">
                </div>
                <div>
                    <label for="email" class="field-label">Email</label>
                    <input type="email" id="email" name="email" required
                           class="input" placeholder="user@example.com" autocomplete="email">
                </div>
                <div>
                    <label for="password" class="field-label">Password</label>
                    <input type="password" id="password" name="password" required
                           class="input" placeholder="••••••••" autocomplete="current-password">
                </div>
                <div class="flex gap-2.5 pt-1">
                    <button type="submit" name="action" value="approve"
                            class="btn btn-primary flex-1">
                        Approve &amp; Sign In
                    </button>
                    <button type="submit" name="action" value="deny" formnovalidate
                            class="btn">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
        <p class="text-center text-xs text-text-mute mt-5">Enterprise OAuth — Lab / Demo use only. Not for production.</p>
    </div>
</body>
</html>
