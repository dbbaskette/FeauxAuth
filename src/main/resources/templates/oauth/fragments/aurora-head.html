<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Aurora head fragment — shared by every OAuth template.
  Mirrors frontend/tailwind.config.js + frontend/src/index.css. Keep in sync.
  See: docs/superpowers/specs/2026-05-13-aurora-design-system-design.md
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Enterprise OAuth</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#07080d',
              'surface-0': '#0c0f17',
              'surface-1': '#11141d',
              'surface-2': '#161a25',
              'surface-3': '#1d2230',
              border: { DEFAULT: 'rgba(255,255,255,0.06)', strong: 'rgba(255,255,255,0.10)' },
              text: { DEFAULT: '#e8ebf2', dim: '#9aa3b7', mute: '#5d6478' },
            },
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            borderRadius: { sm: '6px', DEFAULT: '10px', lg: '14px', xl: '20px' },
            boxShadow: {
              elev: '0 20px 60px -20px rgba(0,0,0,0.6), 0 2px 0 rgba(255,255,255,0.03) inset',
              'glow-primary': '0 0 0 1px rgba(139,92,246,0.25), 0 10px 40px -10px rgba(99,102,241,0.5)',
            },
            backgroundImage: {
              'primary-gradient': 'linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #22d3ee 110%)',
              'primary-gradient-soft': 'linear-gradient(135deg, rgba(139,92,246,0.18), rgba(99,102,241,0.10) 60%, rgba(34,211,238,0.10))',
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer components {
        .btn {
          @apply inline-flex items-center justify-center gap-2 px-4 py-2.5 text-sm font-semibold rounded
                 border border-border-strong bg-surface-3 text-text
                 transition-[transform,box-shadow,background-color] duration-150
                 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 focus-visible:ring-offset-2 focus-visible:ring-offset-bg
                 disabled:opacity-50 disabled:cursor-not-allowed;
        }
        .btn-primary { @apply border-0 text-white bg-primary-gradient shadow-glow-primary; }
        .btn-ghost   { @apply bg-transparent border-transparent text-text-dim hover:text-text hover:bg-surface-2; }
        .btn-block   { @apply w-full; }
        .btn-sm      { @apply px-3 py-1.5 text-[13px]; }
        .field-label { @apply block text-xs font-medium text-text-dim mb-1.5; }
        .input {
          @apply w-full px-3.5 py-2.5 text-sm rounded
                 bg-surface-0 border border-border-strong text-text placeholder:text-text-mute
                 transition-[border-color,box-shadow] duration-150
                 focus:outline-none focus:border-violet-500;
        }
        .card-elev {
          @apply rounded-lg border border-border-strong p-6 shadow-elev;
          background: linear-gradient(180deg, #161a25, #11141d);
        }
        .badge {
          @apply inline-flex items-center gap-1.5 text-[11px] font-semibold px-2.5 py-1 rounded-full
                 border border-border-strong bg-surface-2 text-text-dim uppercase;
          letter-spacing: 0.02em;
        }
        .badge-dot { @apply w-1.5 h-1.5 rounded-full; background: currentColor; }
        .badge-read    { color: #34d399; background: rgba(52,211,153,0.08);  border-color: rgba(52,211,153,0.25); }
        .badge-write   { color: #fbbf24; background: rgba(251,191,36,0.08);  border-color: rgba(251,191,36,0.25); }
        .badge-admin   { color: #fb7185; background: rgba(251,113,133,0.08); border-color: rgba(251,113,133,0.30); }
        .badge-info    { color: #67e8f9; background: rgba(34,211,238,0.08);  border-color: rgba(34,211,238,0.25); }
        .badge-success { color: #34d399; background: rgba(52,211,153,0.08);  border-color: rgba(52,211,153,0.25); }
        .badge-danger  { color: #fb7185; background: rgba(251,113,133,0.08); border-color: rgba(251,113,133,0.30); }
        .eyebrow {
          @apply text-[11px] uppercase font-semibold text-text-mute;
          letter-spacing: 0.2em;
        }
        .brand-mark {
          @apply inline-grid place-items-center w-11 h-11 rounded-lg text-white font-bold text-[16px] shadow-glow-primary relative bg-primary-gradient;
        }
        .scope-row {
          @apply flex items-center gap-3 p-2.5 rounded transition-colors;
        }
        .scope-row .scope-name { @apply font-mono text-sm text-text; }
        .scope-row .scope-desc { @apply text-xs text-text-mute; }
        .alert-error {
          @apply rounded border border-rose-500/30 bg-rose-500/5 text-rose-300 px-3.5 py-2.5 text-sm;
        }
      }
    </style>
    <style>
      html, body { font-family: 'Inter', system-ui, sans-serif; }
      body {
        background-color: #07080d;
        background-image: radial-gradient(ellipse 80% 60% at 20% -10%, rgba(108,75,255,0.18), transparent 60%),
                          radial-gradient(ellipse 60% 50% at 90% 0%, rgba(34,211,238,0.10), transparent 55%);
        background-attachment: fixed;
        color: #e8ebf2;
      }
      ::selection { background: rgba(139,92,246,0.35); color: #fff; }
    </style>
</head>
</html>
