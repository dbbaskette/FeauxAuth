<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Sign-In — FeauxAuth</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-900 flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="bg-gray-800 rounded-2xl shadow-xl p-8 text-center">
            <div th:if="${!denied}">
                <div class="text-emerald-400 text-5xl mb-4">&#10003;</div>
                <h1 class="text-xl font-bold text-white mb-2">You're signed in</h1>
                <p class="text-gray-400 mb-1">
                    Signed in as
                    <span class="text-indigo-400" th:text="${userEmail}">user@example.com</span>
                </p>
                <p class="text-gray-400">
                    for
                    <span class="text-indigo-400" th:text="${clientName}">App</span>
                </p>
                <p class="text-gray-500 text-sm mt-6">You can close this tab and return to your device.</p>
            </div>
            <div th:if="${denied}">
                <div class="text-red-400 text-5xl mb-4">&times;</div>
                <h1 class="text-xl font-bold text-white mb-2">Sign-in cancelled</h1>
                <p class="text-gray-400">The device will report that authorization was denied.</p>
                <p class="text-gray-500 text-sm mt-6">You can close this tab.</p>
            </div>
            <div class="mt-6">
                <p class="text-xs text-gray-500">FeauxAuth — Lab / Demo use only</p>
            </div>
        </div>
    </div>
</body>
</html>
