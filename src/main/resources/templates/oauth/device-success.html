<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{oauth/fragments/aurora-head :: head('Device Sign-In — Enterprise OAuth')}"></head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
        <div class="card-elev text-center">
            <div th:if="${!denied}">
                <div class="w-12 h-12 rounded-full mx-auto mb-4 grid place-items-center"
                     style="background: rgba(52,211,153,0.12); color: #34d399;">
                    <svg width="22" height="22" viewBox="0 0 20 20" fill="currentColor"><path d="M16.7 5.3a1 1 0 010 1.4l-8 8a1 1 0 01-1.4 0l-4-4a1 1 0 011.4-1.4L8 12.6l7.3-7.3a1 1 0 011.4 0z"/></svg>
                </div>
                <div class="eyebrow">Success</div>
                <h1 class="text-xl font-bold text-text mt-1">You're signed in</h1>
                <p class="text-text-dim text-sm mt-2.5">
                    Signed in as
                    <span class="font-mono text-text" th:text="${userEmail}">user@example.com</span>
                </p>
                <p class="text-text-dim text-sm mt-1">
                    for
                    <span class="font-semibold text-text" th:text="${clientName}">App</span>
                </p>
                <p class="text-text-mute text-xs mt-6">You can close this tab and return to your device.</p>
            </div>
            <div th:if="${denied}">
                <div class="w-12 h-12 rounded-full mx-auto mb-4 grid place-items-center"
                     style="background: rgba(251,113,133,0.12); color: #fb7185;">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M4.3 4.3a1 1 0 011.4 0L10 8.6l4.3-4.3a1 1 0 111.4 1.4L11.4 10l4.3 4.3a1 1 0 11-1.4 1.4L10 11.4l-4.3 4.3a1 1 0 11-1.4-1.4L8.6 10 4.3 5.7a1 1 0 010-1.4z"/></svg>
                </div>
                <div class="eyebrow">Cancelled</div>
                <h1 class="text-xl font-bold text-text mt-1">Sign-in cancelled</h1>
                <p class="text-text-dim text-sm mt-2.5">The device will report that authorization was denied.</p>
                <p class="text-text-mute text-xs mt-6">You can close this tab.</p>
            </div>
        </div>
        <p class="text-center text-xs text-text-mute mt-5">Enterprise OAuth — Lab / Demo use only.</p>
    </div>
</body>
</html>
