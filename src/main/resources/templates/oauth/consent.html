<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{oauth/fragments/aurora-head :: head('Authorize — Enterprise OAuth')}"></head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
        <div class="card-elev">
            <div class="text-center mb-6">
                <div class="brand-mark mx-auto mb-3" th:text="${#strings.toUpperCase(#strings.substring(clientName, 0, 1))}">A</div>
                <div class="eyebrow">Authorize</div>
                <div class="text-[20px] font-semibold text-text mt-1">
                    <span th:text="${clientName}">App</span> wants access
                </div>
                <p class="text-text-dim text-sm mt-1.5">Review the permissions below before approving.</p>
            </div>

            <div class="flex items-center justify-between mb-2.5">
                <span class="eyebrow">Requested permissions</span>
            </div>

            <ul class="space-y-1 mb-6">
                <li th:each="item : ${scopeItems}" class="scope-row">
                    <span th:class="'badge badge-' + ${item.risk}">
                        <span class="badge-dot"></span>
                        <span th:text="${#strings.toUpperCase(item.risk)}">READ</span>
                    </span>
                    <div class="flex-1 min-w-0">
                        <div class="scope-name" th:text="${item.scope}">openid</div>
                        <div class="scope-desc" th:text="${item.description}">Verify your identity</div>
                    </div>
                </li>
            </ul>

            <form method="post" th:action="@{/oauth/consent}" class="space-y-2.5">
                <button type="submit" name="approve" value="true" class="btn btn-primary btn-block">Allow Access</button>
                <button type="submit" name="approve" value="false" class="btn btn-block bg-transparent border-border text-text-dim hover:text-text hover:bg-surface-2">Deny</button>
            </form>

            <p class="text-center text-xs text-text-mute mt-5">
                Signed in as
                <span class="font-mono text-text-dim" th:text="${userEmail}">user</span>
            </p>
        </div>
    </div>
</body>
</html>
