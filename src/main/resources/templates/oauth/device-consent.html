<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{oauth/fragments/aurora-head :: head('Authorize — Enterprise OAuth')}"></head>
<body class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
        <div class="text-center mb-3">
            <div class="eyebrow">Device Sign-In · Step 3 of 3</div>
        </div>
        <div class="card-elev">
            <div th:replace="~{oauth/fragments/consent-card :: body(
                clientName=${clientName},
                clientInitial=${clientInitial},
                redirectHost=null,
                userEmail=${userEmail},
                scopeItems=${scopeItems},
                approveAction=@{/device/authorize},
                approveValue='true',
                denyValue='false',
                approveLabel='Approve &amp; Finish',
                denyLabel='Deny')}"></div>
        </div>
    </div>
</body>
</html>
